[package]
name = "rollup-core-state"
version = "0.1.0"
edition = "2021"

[dependencies]
rollup-shared-types = { path = "../shared-types" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[features]
default = ["std"]
std = []
guest = []

[dependencies.sha2]
version = "0.10"

[dependencies.hex]
version = "0.4"
optional = true

[lib]
name = "rollup_core_state"
