[workspace]
members = [
    "guest",
    "host", 
    "methods",
    "shared-types",
    "core-state"
]

[workspace.dependencies]
risc0-zkvm = "0.11.1"
risc0-zkvm-guest = "0.11.1"
risc0-build = "0.11.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
