[package]
name = "rollup-guest"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm-guest.workspace = true
rollup-shared-types = { path = "../shared-types" }
rollup-core-state = { path = "../core-state", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]
